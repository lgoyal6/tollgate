apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: tollgate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The verified two-node shape has room for three requested gateway pods,
      # but not Kubernetes' default 25% surge pod. Preserve two available pods
      # during updates without requiring extra worker capacity.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      # runAsNonRoot alone only asserts "not uid 0". If the image never declares a
      # USER the kubelet refuses to start the pod rather than choosing one, so the
      # uid is named here and the chart works against a plain distroless base.
      # Read from values rather than hardcoded, so an operator whose base image
      # uses a different uid can change it without editing a template.
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      # DRAIN_DELAY + SHUTDOWN_TIMEOUT must fit inside this budget.
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
            - name: REDIS_ADDR
              value: {{ .Values.redisAddr | quote }}
            - name: RATE_LIMITER
              value: {{ .Values.limiter | quote }}
            - name: TOLLGATE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $name, $ref := .Values.upstreamCredentials }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          # Kubernetes "restricted" Pod Security Standard. The three fields that
          # were already here cover privilege escalation, a writable root and
          # root itself; dropping ALL capabilities and pinning a seccomp profile
          # are the two the restricted profile also requires, and without them
          # the pod is rejected outright by a namespace labelled
          # pod-security.kubernetes.io/enforce=restricted.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
