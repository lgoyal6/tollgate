name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Formatting, vet, build and the unit suite. gofmt is checked by listing
  # what it would change rather than by rewriting: a formatter that fixes the
  # tree in CI is a formatter nobody runs locally.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # The spend ledger's guarantees ARE PostgreSQL's - FOR UPDATE row locking,
  # transaction atomicity, a unique index for idempotency. A fake would only test
  # the fake, so these tests skip unless pointed at a real database, and this job
  # is what points them at one. Without it they would silently never run.
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tollgate
          POSTGRES_PASSWORD: tollgate
          POSTGRES_DB: tollgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tollgate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # -count=1 defeats the test cache: a green cached result against a database
      # that was never reached is exactly the failure this job exists to catch.
      - run: go test ./internal/budget/ -v -count=1 -race
        env:
          TOLLGATE_TEST_DATABASE_URL: postgres://tollgate:tollgate@localhost:5432/tollgate?sslmode=disable
      # The management API's integration tests gate on their own variable, and
      # nothing set it, so the whole key lifecycle suite - revoke, rotate,
      # grace expiry, the OpenAPI conformance run - was skipping in CI while
      # reporting green. Same database, same job: what they need a real
      # PostgreSQL for is the same LISTEN/NOTIFY and constraint behaviour the
      # ledger needs, and a fake would only test the fake.
      - run: go test ./internal/admin/ -v -count=1 -race
        env:
          TOLLGATE_TEST_POSTGRES: postgres://tollgate:tollgate@localhost:5432/tollgate?sslmode=disable
      # The outbox's claim is that a usage window and the message reporting it
      # commit together, and that a redelivery lands in an inbox row that is
      # already there. Both are claims about two SEPARATE databases, so the
      # suite needs a second one and skips itself without it - which meant it
      # ran nowhere. This creates the consumer database in the same service
      # container and points the suite at both.
      - name: consumer database for the outbox suite
        run: |
          PGPASSWORD=tollgate psql -h localhost -U tollgate -d tollgate \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE billing'
      - run: go test ./internal/outbox/ -v -count=1 -race
        env:
          TOLLGATE_TEST_POSTGRES: postgres://tollgate:tollgate@localhost:5432/tollgate?sslmode=disable
          TOLLGATE_TEST_BILLING: postgres://tollgate:tollgate@localhost:5432/billing?sslmode=disable

  # A NetworkPolicy whose selector matches nothing is not a weaker policy, it is
  # no policy, and Kubernetes accepts it without complaint. The chart shipped
  # exactly that defect once (it selected `app: <release>`, a label these pods
  # have never carried), so the render is now checked against the Deployment's
  # own pod labels rather than eyeballed.
  netpol-selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the policy must select the gateway pods and nothing else
        run: |
          python3 -m pip install --quiet pyyaml
          helm template tg deploy/helm/tollgate --set networkPolicy.enabled=true > /tmp/render.yaml
          python3 - <<'EOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/render.yaml')) if d]
          sel, deploys = None, {}
          for d in docs:
              if d.get('kind') == 'Deployment':
                  deploys[d['metadata']['name']] = d['spec']['template']['metadata']['labels']
              if d.get('kind') == 'NetworkPolicy':
                  sel = d['spec']['podSelector']['matchLabels']
          if not sel:
              sys.exit('no NetworkPolicy rendered')
          matched = [n for n, l in deploys.items()
                     if all(l.get(k) == v for k, v in sel.items())]
          print('selector', sel, 'matches', matched)
          if matched != ['tg']:
              sys.exit(f'selector must match exactly the gateway pods, matched {matched}')
          EOF

  # Its own job rather than a flag on the one above. The gateway's whole
  # premise is concurrent: a shared limiter, a hot-reloaded config snapshot
  # read by every request, a JWKS cache with an in-flight fetch collapsed
  # across goroutines, and a token cache read under load. A data race in any
  # of those is a correctness bug that a serial test will never show, so it
  # gets a check of its own that can be pointed at.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  # The distributed limiter against a real Redis.
  #
  # The token bucket and sliding window are Lua, and their correctness claim is
  # that the check-and-decrement is atomic inside the script, so N concurrent
  # callers can never be admitted past the limit. That is not a claim the
  # in-memory limiter can stand in for, and the tests skip themselves without
  # TOLLGATE_TEST_REDIS, which means without this job they were silently not
  # running anywhere.
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: limiter against redis
        env:
          TOLLGATE_TEST_REDIS: localhost:6379
        # -count=1 so a cached pass from the job above cannot stand in for a
        # run that actually reached Redis.
        run: go test -count=1 -v ./internal/ratelimit/

  # The image the PaaS templates and the Helm chart both deploy. A Dockerfile
  # that stopped building would only show up at deploy time otherwise, which
  # is the worst place to find out.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gateway image
        run: docker build -t tollgate:ci .
      - name: demo upstream image
        run: docker build -f Dockerfile.upstream -t tollgate-upstream:ci .
      - name: the build context carries no credential and no .git
        # Reads the layers rather than the .dockerignore. The build stage does a
        # bare `COPY . .`, so a developer's .env or TLS key beside the source
        # ends up in a cached, exportable layer, and deleting a line from
        # .dockerignore is otherwise a silent change. The script plants
        # credential-shaped fixtures, never a real credential.
        run: scripts/check-build-context.sh
