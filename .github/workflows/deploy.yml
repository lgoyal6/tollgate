name: Deploy to Amazon EKS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: tollgate
  ECR_GATEWAY_REPOSITORY: tollgate
  ECR_UPSTREAM_REPOSITORY: tollgate-upstream
  KUBE_NAMESPACE: tollgate

jobs:
  build-push-deploy:
    if: ${{ !contains(github.ref_name, '-oidc-proof.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      IMAGE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || {
            echo "AWS_ROLE_ARN repository secret is required" >&2
            exit 1
          }
          [[ "${IMAGE_TAG}" == v* ]] || {
            echo "deployment requires a v* version tag" >&2
            exit 1
          }

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Compare the OIDC token this job is holding against the trust policy in
      # deploy/terraform/aws/main.tf before spending a round trip on STS. A
      # mismatch otherwise arrives as "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity", which names neither the claim that did
      # not match nor the pattern it was compared against.
      #
      # -environment is empty because this job does not run in a GitHub
      # Environment. Pinning the deployment to one means creating a
      # `production` environment on the repository and adding
      # `environment: production` to this job; the check is ready for it.
      - name: Verify the deployment identity is in policy
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tollgate-oidc-preflight \
            -audience sts.amazonaws.com \
            -environment "" \
            -workflow .github/workflows/deploy.yml

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: gateway
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_GATEWAY_REPOSITORY }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Build and push mock upstream image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: upstream
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_UPSTREAM_REPOSITORY }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

      - name: Configure kubectl
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"
          kubectl version --client
          helm version

      - name: Verify in-cluster backing stores
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "${KUBE_NAMESPACE}"
          kubectl rollout status statefulset/postgres \
            -n "${KUBE_NAMESPACE}" \
            --timeout=5m
          kubectl rollout status deployment/redis \
            -n "${KUBE_NAMESPACE}" \
            --timeout=5m

      - name: Apply database migrations and seed routes
        shell: bash
        run: |
          set -euo pipefail
          # Every numbered migration, in order, rather than a hand-written list.
          # The list drifted: 003_budget_ledger.sql shipped and this step still
          # named only 001 and 002, so a fresh cluster came up without the spend
          # ledger. The gateway's own Migrate() globs the same set on boot, which
          # is what hid it. Matching that glob here means the next migration
          # cannot be forgotten in the same way.
          for migration in $(ls migrations/[0-9]*.sql | sort); do
            kubectl exec -i statefulset/postgres \
              -n "${KUBE_NAMESPACE}" \
              -- psql -v ON_ERROR_STOP=1 -U tollgate -d tollgate < "${migration}"
          done
          sed \
            -e 's|__UPSTREAM_A__|upstream-a:9000|g' \
            -e 's|__UPSTREAM_B__|upstream-b:9000|g' \
            migrations/seed.sql \
            | kubectl exec -i statefulset/postgres \
                -n "${KUBE_NAMESPACE}" \
                -- psql -v ON_ERROR_STOP=1 -U tollgate -d tollgate

      - name: Install Prometheus and the custom-metrics adapter
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/prometheus \
            --version 29.24.0 \
            --namespace monitoring \
            --create-namespace \
            --values deploy/monitoring/prometheus-values.yaml \
            --wait \
            --timeout 10m
          helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
            --version 5.3.0 \
            --namespace monitoring \
            --values deploy/monitoring/adapter-values.yaml \
            --wait \
            --timeout 10m

      - name: Deploy Tollgate
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          helm upgrade --install tollgate deploy/helm/tollgate \
            --namespace "${KUBE_NAMESPACE}" \
            --set-string image.repository="${ECR_REGISTRY}/${ECR_GATEWAY_REPOSITORY}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            --set-string demoUpstreams.image="${ECR_REGISTRY}/${ECR_UPSTREAM_REPOSITORY}:${IMAGE_TAG}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/tollgate \
            -n "${KUBE_NAMESPACE}" \
            --timeout=5m
          kubectl rollout status deployment/upstream-a \
            -n "${KUBE_NAMESPACE}" \
            --timeout=5m
          kubectl rollout status deployment/upstream-b \
            -n "${KUBE_NAMESPACE}" \
            --timeout=5m
          kubectl get deployment,statefulset,hpa,pod \
            -n "${KUBE_NAMESPACE}"
          echo "::notice title=Teardown required::Run deploy/terraform/aws/teardown.sh when verification is complete. The cluster bills continuously."

  verify-gcp-oidc:
    if: ${{ contains(github.ref_name, '-oidc-proof.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_REPOSITORY: ${{ vars.GCP_REPOSITORY }}
      GCP_DENIED_REPOSITORY: ${{ vars.GCP_DENIED_REPOSITORY }}
      GCP_RUNTIME_SECRET: ${{ vars.GCP_RUNTIME_SECRET }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Inspect the GitHub-issued OIDC claims
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          for value in \
            "$WORKLOAD_IDENTITY_PROVIDER" \
            "$GCP_PROJECT" \
            "$GCP_REGION" \
            "$GCP_REPOSITORY" \
            "$GCP_DENIED_REPOSITORY" \
            "$GCP_RUNTIME_SECRET" \
            "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"; do
            test -n "$value"
          done
          response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${WORKLOAD_IDENTITY_PROVIDER}")"
          oidc_jwt="$(jq -r '.value' <<<"$response")"
          OIDC_JWT="$oidc_jwt" python3 - <<'PY'
          import base64
          import json
          import os

          encoded = os.environ["OIDC_JWT"].split(".")[1]
          payload = json.loads(base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)))
          fields = [
              "iss", "aud", "sub", "repository", "repository_id",
              "repository_owner_id", "ref", "ref_type", "environment",
              "job_workflow_ref", "iat", "exp",
          ]
          print(json.dumps({field: payload.get(field) for field in fields}, sort_keys=True))
          lifetime = int(payload["exp"]) - int(payload["iat"])
          if lifetime <= 0 or lifetime > 600:
              raise SystemExit(f"OIDC token lifetime {lifetime}s is not short-lived")
          print(f"github_oidc_lifetime_seconds={lifetime}")
          PY
          unset oidc_jwt response OIDC_JWT

      - name: Exchange GitHub OIDC for a bounded GCP deployment identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify allowed deployment work and denied lateral access
        shell: bash
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$active" = "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"

          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          printf 'FROM scratch\nLABEL purpose=c10-oidc-proof\n' >"$probe_dir/Dockerfile"
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GCP_REPOSITORY}/oidc-proof:${GITHUB_RUN_ID}"
          docker build -q -t "$image" "$probe_dir" >/dev/null
          docker push "$image" >/dev/null
          echo "allowed_repository_push=ok"

          if gcloud artifacts docker images list \
            "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${GCP_DENIED_REPOSITORY}" \
            >/tmp/denied-repository 2>&1; then
            echo "deployment identity unexpectedly read the denied repository" >&2
            exit 1
          fi
          grep -Eq 'PERMISSION_DENIED|Permission.*denied' /tmp/denied-repository
          echo "denied_other_repository=ok"

          if gcloud secrets versions access latest \
            --secret "$GCP_RUNTIME_SECRET" --project "$GCP_PROJECT" \
            >/tmp/denied-secret 2>&1; then
            echo "deployment identity unexpectedly read a runtime secret" >&2
            exit 1
          fi
          grep -Eq 'PERMISSION_DENIED|Permission.*denied' /tmp/denied-secret
          echo "denied_runtime_secret=ok"

          token_info="$(curl -fsS --get https://oauth2.googleapis.com/tokeninfo \
            --data-urlencode "access_token=${GCP_ACCESS_TOKEN}")"
          expires_in="$(jq -r '.expires_in | tonumber' <<<"$token_info")"
          unset token_info
          test "$expires_in" -gt 0
          test "$expires_in" -le 900
          echo "gcp_access_token_remaining_seconds=$expires_in"

      - name: Check tracked files for credential material
        shell: bash
        run: |
          set -euo pipefail
          # The build-context test intentionally plants fake private-key headers
          # to prove the image excludes them. Scan every other tracked file.
          if git grep -nE '(ya29\.|gh[opsu]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            -- . ':(exclude)scripts/check-build-context.sh'; then
            echo "credential-shaped material found in tracked files" >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "tracked_credential_scan=clean"
