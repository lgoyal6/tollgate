name: attest

# Build provenance and SBOM attestation for the shipped binaries.
#
# Push-triggered on purpose: the attestation is a statement about a build that
# actually happened, signed with an identity only GitHub's OIDC issuer can mint
# for this repository. There is no way to produce one out of band, which is what
# makes `gh attestation verify` mean anything.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token Sigstore binds the signature to
      attestations: write # write the signed bundle to this repository's attestation store
    steps:
      # Every action is pinned to a commit SHA rather than a tag: a tag is a
      # mutable pointer its owner can move to different code at any time, so a
      # tag pin does not fix what actually runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `make build` rather than an inlined `go build`, so what gets attested is
      # the same command the repository already defines as its build.
      - name: build
        run: make build

      # The digests the attestation will carry. Printed so the value a verifier
      # computes locally can be compared against the run that produced it.
      - name: artifact digests
        run: sha256sum bin/gateway bin/tollgate-admin | tee artifact-digests.txt

      # Read out of the linked binary rather than off go.mod: a Go binary carries
      # the module set that was actually built into it, which is the set the
      # provenance attestation is a statement about. go.mod lists what the source
      # tree asks for, which is not the same claim.
      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: bin/gateway
          format: spdx-json
          output-file: tollgate-gateway.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/gateway
            bin/tollgate-admin

      # Only the gateway: the SBOM was read out of the gateway binary, so it is a
      # statement about that binary and attaching it to the admin tool would be a
      # claim the scan never made.
      - name: attest sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: bin/gateway
          sbom-path: tollgate-gateway.spdx.json

      # The attested bytes themselves, so verification can be run against the
      # exact artifact the attestation names rather than a local rebuild.
      - name: upload attested artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tollgate-attested
          path: |
            bin/gateway
            bin/tollgate-admin
            tollgate-gateway.spdx.json
            artifact-digests.txt
          if-no-files-found: error
