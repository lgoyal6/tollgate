<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tollgate console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='7' width='14' height='2' fill='%231f4d33'/%3E%3Crect x='2' y='10' width='3' height='5' fill='%2357513f'/%3E%3Crect x='6.5' y='10' width='3' height='5' fill='%2357513f'/%3E%3Crect x='11' y='10' width='3' height='5' fill='%2357513f'/%3E%3Crect x='6.5' y='1' width='3' height='5' fill='%231f4d33'/%3E%3C/svg%3E">
<style>
  :root {
    --ink:#17190f; --paper:#f4f1e8; --rule:#d6d0bd; --dim:#6b6754;
    --gate:#1f4d33; --post:#57513f; --alarm:#8c2f21; --card:#fbf9f3;
    --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme:dark) {
    :root { --ink:#eae6d9; --paper:#14150f; --rule:#33352a; --dim:#9b9784;
            --gate:#7fc09b; --post:#b0a98d; --alarm:#e08a7a; --card:#1c1e16; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { border-bottom:1px solid var(--rule); padding:18px 24px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font:600 20px/1 var(--mono); margin:0; letter-spacing:-.01em; }
  h1 b { color:var(--gate); }
  .sub { color:var(--dim); font-size:13px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  section { margin-bottom:32px; }
  h2 { font:600 13px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--rule); border-radius:6px; padding:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font:600 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--dim); padding:0 10px 8px 0; white-space:nowrap; }
  td { padding:9px 10px 9px 0; border-top:1px solid var(--rule); vertical-align:middle; }
  .mono { font-family:var(--mono); font-size:13px; }
  .wrap { overflow-x:auto; }
  button { font:500 13px/1 inherit; padding:7px 11px; border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:5px; cursor:pointer; }
  button:hover { border-color:var(--gate); }
  button.primary { background:var(--gate); border-color:var(--gate); color:var(--paper); font-weight:600; }
  button.danger:hover { border-color:var(--alarm); color:var(--alarm); }
  button:disabled { opacity:.45; cursor:default; }
  input, select { font:14px/1 inherit; padding:7px 9px; border:1px solid var(--rule); border-radius:5px; background:var(--paper); color:var(--ink); width:100%; }
  label { display:block; font:600 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:5px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); align-items:end; }
  .pill { display:inline-block; font:600 11px/1 var(--mono); padding:3px 7px; border-radius:99px; border:1px solid var(--rule); color:var(--dim); }
  .pill.on { color:var(--gate); border-color:var(--gate); }
  .pill.off { color:var(--alarm); border-color:var(--alarm); }
  .gate { border-left:3px solid var(--gate); padding-left:12px; }
  .secret { background:var(--gate); color:var(--paper); padding:14px 16px; border-radius:6px; margin:0 0 24px; }
  .secret code { font-family:var(--mono); font-size:14px; word-break:break-all; display:block; margin:8px 0; user-select:all; }
  .secret .why { font-size:12px; opacity:.85; }
  .secret-close { margin-top:12px; border-color:currentColor; background:transparent; color:inherit; }
  .err { color:var(--alarm); font-size:13px; margin-top:8px; }
  .banner { border:1px solid var(--alarm); border-radius:5px; padding:10px 12px; margin-bottom:16px; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }
  #gate-screen { max-width:420px; margin:80px auto; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .action-row { margin-top:12px; }
  .num { font-family:var(--mono); font-size:13px; text-align:right; }
  .limited { color:var(--alarm); font-weight:600; }
  [v-cloak] { display:none; }
</style>
</head>
<body>
<div id="app" v-cloak></div>
<script>window.__TOLLGATE_MOUNT__ = {{ .Mount }};</script>
<script src="{{ .Mount }}/assets/console.js" defer></script>
</body>
</html>
