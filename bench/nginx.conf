# Load balancer for the bench stack: round-robin over the 3 gateway replicas.
# The `gateway` service name resolves to all replica IPs at nginx startup;
# bench/run.sh restarts this container after recreating the gateways so the
# resolved set is never stale.
worker_processes 4;
worker_rlimit_nofile 16384;

events {
  worker_connections 8192;
}

http {
  access_log off;

  upstream gateways {
    server gateway:8080;
    keepalive 256;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
